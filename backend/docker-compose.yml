services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-turnos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - clinica-turnos-data:/var/lib/postgresql/data

volumes:
  clinica-turnos-data:
