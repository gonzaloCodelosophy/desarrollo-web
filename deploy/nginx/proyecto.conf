
server {
    listen 80;
    listen [::]:80;
    server_name proyecto.local;

    root /var/www/proyecto/frontend/dist/frontend/browser; #Esto se cambia por el path del proyecto
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets
    location ~ \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Backend NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Angular todas las rutas que no sean archivos van para el index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
