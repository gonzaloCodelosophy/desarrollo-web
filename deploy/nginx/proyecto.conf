events{
  worker_connections 1024;
}

http {
    include mime.types;
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /home/nemesys/desarrollo-web/ssh/localhost.pem;
        ssl_certificate_key /home/nemesys/desarrollo-web/ssh/localhost-key.pem;

        location / {
            root /home/nemesys/desarrollo-web/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    

        location /api/ {
            proxy_pass http://127.0.0.1:8051;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

 
}