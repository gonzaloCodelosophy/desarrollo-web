<header>
  <span>
    <svg viewBox="0 0 80 75" height="45" width="45">
      <path d="M39 36C28 25 28 12 41 0c12 13 12 25-2 36Z" />
      <path d="M34 65C17 65 5 54 3 35c19-1 31 10 31 30Z" />
      <path d="M44 65C61 64 74 51 75 32 56 35 45 46 44 65Z" />
    </svg>
  </span>
  <div>
    <span>Clínica</span>
    <span>San Martín</span>
  </div>
  <span>
    {{ currentUser?.nombres }} {{ currentUser?.apellidos }}
    ({{ userRole }})
  </span>
  <button type="button" (click)="logout()">Cerrar sesión</button>
  <button type="button" class="btn btn-outline btn-icon" aria-label="Modo oscuro"
    [attr.aria-pressed]="themeService.theme() === 'dark'"
    [attr.title]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    (click)="themeService.toggleTheme()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (themeService.theme() === 'dark') {
      <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
      } @else {
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      }
    </svg>
  </button>
</header>

<nav>
  @switch (userRole) {
  @case ('PACIENTE') {
  <a routerLink="/paciente/turnos">Mis turnos</a>
  <a routerLink="/paciente/reservar">Reservar turno</a>
  }
  @case ('MEDICO') {
  <a routerLink="/medico/agenda">Agenda</a>
  }
  @case ('ADMINISTRADOR') {
  <a routerLink="/administracion/turnos">Turnos</a>
  <a routerLink="/administracion/reservar">Reservar</a>
  <a routerLink="/administracion/aranceles">Aranceles</a>
  }
  }
</nav>

<main>
  <router-outlet />
</main>
